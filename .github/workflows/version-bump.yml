name: Version bump

# Manually bump the package version. Rewrites apm.yml (top-level `version:` and
# every mirrored `marketplace.packages[].version`) and opens a release PR.
# Merging that PR triggers the Release workflow, which tags v<version>.
on:
  workflow_dispatch:
    inputs:
      level:
        description: Semver level to bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write
  pull-requests: write

# Serialize runs so overlapping dispatches can't force-push the same release
# branch over each other.
concurrency:
  group: version-bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute and apply new version
        id: bump
        env:
          LEVEL: ${{ inputs.level }}
        run: |
          python3 - <<'PY'
          import re, os
          s = open("apm.yml").read()
          cur = re.search(r'(?m)^version:\s*"?([0-9]+\.[0-9]+\.[0-9]+)"?', s).group(1)
          M, m, p = map(int, cur.split("."))
          lvl = os.environ["LEVEL"]
          if lvl == "major": M, m, p = M + 1, 0, 0
          elif lvl == "minor": m, p = m + 1, 0
          else: p += 1
          new = f"{M}.{m}.{p}"
          # top-level version (unquoted, first line only)
          s = re.sub(r'(?m)^version:\s*.*$', f'version: {new}', s, count=1)
          # marketplace.packages[].version (quoted + indented) -> keep mirrored
          s = re.sub(r'(?m)^(\s+version:\s*)"[0-9]+\.[0-9]+\.[0-9]+"',
                     rf'\g<1>"{new}"', s)
          open("apm.yml", "w").write(s)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"new={new}\ncur={cur}\n")
          PY

      - name: Open release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW: ${{ steps.bump.outputs.new }}
          CUR: ${{ steps.bump.outputs.cur }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "release/v${NEW}"
          git commit -am "Bump version to ${NEW}"
          # The release branch is regenerated from main on every run, so overwrite
          # any stale branch a previous run may have left behind — otherwise the
          # push is rejected as non-fast-forward.
          git push --force -u origin "release/v${NEW}"
          # Open a PR only if one isn't already open for this branch; a re-run just
          # updates the existing PR's branch via the force-push above. Use
          # `// empty` so an empty list yields "" (not the string "null").
          existing_pr="$(gh pr list --head "release/v${NEW}" --state open --json number --jq '.[0].number // empty')"
          if [ -z "${existing_pr}" ]; then
            gh pr create --base main --head "release/v${NEW}" \
              --title "Release v${NEW}" \
              --body "Automated version bump \`${CUR}\` → \`${NEW}\`.

          Merging this PR tags \`v${NEW}\` and publishes a GitHub Release."
          else
            echo "An open PR (#${existing_pr}) already exists for release/v${NEW}; updated its branch."
          fi
