name: Release

# On merge to main, tag the manifest version (v<version>) if it isn't tagged yet,
# pack the package, and publish a GitHub Release. Idempotent: ordinary content
# merges no-op because the current version's tag already exists. The first run
# backfills the current version's tag.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read manifest version and assert consistency
        id: v
        run: |
          python3 - <<'PY'
          import re, os
          s = open("apm.yml").read()
          top = re.search(r'(?m)^version:\s*"?([0-9.]+)"?', s).group(1)
          mkt = set(re.findall(r'(?m)^\s+version:\s*"([0-9.]+)"', s))
          assert not mkt or mkt == {top}, f"marketplace {mkt} != top-level {top}"
          open(os.environ["GITHUB_OUTPUT"], "a").write(f"version={top}\n")
          PY

      - name: Skip if tag already exists
        id: check
        run: |
          if git rev-parse "v${{ steps.v.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        if: steps.check.outputs.exists == 'false'
        run: |
          git tag "v${{ steps.v.outputs.version }}"
          git push origin "v${{ steps.v.outputs.version }}"

      - name: Publish GitHub Release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          # Consumers install via the git tag (owner/repo#vX.Y.Z), so the release
          # only needs the tag + notes — no packed bundle to attach.
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --generate-notes
