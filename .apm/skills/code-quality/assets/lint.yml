# Lint, format, and type checks.
# Copy to .github/workflows/lint.yml in the consumer repo. Installs deps with
# `uv sync`; adjust the Python version (and the install step only if the project
# doesn't use uv) to match the app.
# See the code-quality skill's references/tooling.md.
name: lint

on:
  pull_request:
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - ".github/workflows/lint.yml"
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        # `uv sync` installs ruff + mypy (dev group) and the app package.
        # If the project doesn't use uv, swap this for your real install.
        run: uv sync

      - name: Check formatting
        # Fails if code isn't formatted; run `ruff format` locally to fix.
        run: uv run ruff format --check .

      - name: Lint
        # Style, imports, naming, and bug-prone patterns (see [tool.ruff.lint]).
        run: uv run ruff check .

      - name: Type-check
        run: uv run mypy
